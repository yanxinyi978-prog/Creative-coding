
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music-Reactive Bouncing Ball</title>

  <meta
    name="description"
    content="An interactive creative coding experiment exploring the relationship between sound, movement and colour."
  >

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/addons/p5.sound.min.js"></script>
  <script src="sketch.js">
  
</script>
</head>

<body>
  <header class="page-header">
    <p class="eyebrow">COMM2754 · CREATIVE CODING</p>

    <h1>Music-Reactive Bouncing Ball</h1>

    <p class="introduction">
      Explore the relationship between sound, movement and colour.
      Play the music, watch the circles react, and click the canvas
      to change their behaviour.
    </p>
  </header>

  <main>
   
      <p id="music-status" aria-live="polite">
      Click on ball to play and pause music
      </p>
    </section>

    <section class="artwork" aria-label="Interactive animation">
      <div id="canvas-holder"></div>
    </section>

 

   
  </main>

  <footer>
    <p>Made with HTML, CSS, JavaScript and p5.js.</p>
  </footer>
